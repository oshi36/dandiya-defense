# Falco rules using the k8s-audit source (requires the k8saudit
# plugin + webhook wired to the API server's audit backend - see
# scripts/04-apply-defenses.sh for the kind-friendly setup).
#
# Unlike Kyverno (admission control - writes only), k8s audit
# events include reads too, so Falco is the layer that sees an
# attempt regardless of whether it was a read or a write, and
# regardless of whether RBAC/Kyverno already blocked it - this is
# your "attack fails AND we can prove it happened" moment.
#
# Save as falco_rules.local.yaml and mount into the Falco pod.

- rule: Agent Identity Attempted Unauthorized Deployment Write
  desc: >
    Detects the k8s-mcp-server agent ServiceAccount attempting to
    update, patch, or scale ANY Deployment other than
    checkout-service - the one thing it's actually meant to
    remediate. This is the primary rule for this demo's attack
    (a poisoned runbook tricking the agent into scaling down
    payment-gateway).
  condition: >
    ka and
    ka.target.resource = "deployments" and
    (ka.verb in (update, patch)) and
    ka.user.name = "system:serviceaccount:agent-system:k8s-mcp-server" and
    ka.target.name != "checkout-service"
  output: >
    Agent identity attempted unauthorized Deployment write
    (user=%ka.user.name verb=%ka.verb resource=%ka.target.resource
    namespace=%ka.target.namespace name=%ka.target.name
    allowed=%ka.auth.allowed reason=%ka.auth.reason)
  priority: CRITICAL
  source: k8s_audit
  tags: [k8s, deployments, dandiya-defense]

- rule: Agent Identity Attempted Secret Access
  desc: >
    Detects the k8s-mcp-server agent ServiceAccount attempting to
    read Secret objects, regardless of whether RBAC allowed or
    denied the call. Not the primary attack in the current version
    of this demo, but kept as a second, unrelated hardening check -
    the agent has no legitimate reason to touch Secrets either.
  condition: >
    ka and
    ka.target.resource = "secrets" and
    (ka.verb in (get, list)) and
    ka.user.name = "system:serviceaccount:agent-system:k8s-mcp-server"
  output: >
    Agent identity attempted secret access
    (user=%ka.user.name verb=%ka.verb resource=%ka.target.resource
    namespace=%ka.target.namespace name=%ka.target.name
    allowed=%ka.auth.allowed reason=%ka.auth.reason)
  priority: CRITICAL
  source: k8s_audit
  tags: [k8s, secrets, dandiya-defense]
