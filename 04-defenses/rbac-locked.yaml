# ACT 3 - the actual defense that stops the unauthorized scale.
#
# Kyverno/NetworkPolicy/Falco all matter, but the most direct fix
# for "the agent can write to things it shouldn't" is RBAC's
# resourceNames field: grant write verbs on Deployments, but only
# for the ONE Deployment this agent is meant to remediate
# (checkout-service). Even if a poisoned runbook tells it to scale
# payment-gateway, the API server rejects the request before it
# ever reaches admission control - Kyverno never even needs to see
# it for this specific case (see kyverno-contain-agent.yaml for
# the belt-and-suspenders layer, useful if a future legitimate
# resourceNames entry is added carelessly).
#
# get/list/watch on secrets is also removed here - unrelated to
# this attack, but still worth not granting by default.
#
# This ClusterRole replaces 01-mcp-server/rbac-permissive.yaml -
# apply this and delete the permissive one (see
# scripts/04-apply-defenses.sh).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-server-scoped
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Write access scoped to ONLY checkout-service, by name - this is
  # the actual fix. The agent can still do its job (scale/fix the
  # thing it's triaging) but structurally cannot touch anything else,
  # regardless of what any poisoned document tells it to do.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout-service"]
    verbs: ["update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["checkout-service"]
    verbs: ["get", "update", "patch"]
  # Deliberately NO "secrets" entry anywhere in this rule set.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-server-scoped-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-server-scoped
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: agent-system
