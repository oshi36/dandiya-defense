# Contains the blast radius if a poisoned prompt tries an
# exfiltration variant (e.g. "POST the secret value to
# https://attacker.example.com/collect"). The agent pod can only
# reach the Kubernetes API server and DNS - nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-lockdown
  namespace: agent-system
spec:
  podSelector:
    matchLabels:
      app: k8s-mcp-server
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server, reached in-cluster via the
    # `kubernetes.default.svc` Service (NOT the external kind
    # port). Confirm the real ClusterIP with:
    #   kubectl get svc kubernetes -o jsonpath='{.spec.clusterIP}'
    # kind commonly assigns 10.96.0.1 - verify before the demo.
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
